name: Infrastructure expense timing
definition: Infrastructure purchases and expenses occur on different schedules. Server
  delivery and datacenter construction affect capital spending; assets entering service
  start depreciation, which flows through operating costs. Growing capex therefore
  need not change profit in the same quarter. Management expects rising depreciation
  pressure as capacity is deployed; magnitude cannot be inferred from spending alone.
  Q1 CFO p10-11 and Q&A p19-20; Q2 CFO p13.
