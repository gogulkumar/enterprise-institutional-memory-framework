name: Cloud monetization constraints
definition: Cloud demand and recognized revenue are separated by available serving
  capacity. Management describes supply constraints despite demand, with additions
  arriving unevenly across quarters; spending commitments do not guarantee immediately
  usable capacity. Fleet utilization supports profitability but does not by itself
  reveal demand or incremental margin. The mechanism remains management-attributed,
  not a separately verified capacity model. Q1 CFO p10-11, Q&A p14-16; Q2 p13,23-24.
