trigger: Consolidated operating margin moves outside its normal seasonal pattern, or diverges from segment margin trends.
question_sequence:
- Did Alphabet-level unallocated costs change as a share of total revenue?
- Did revenue mix shift materially between Google Services and Google Cloud?
- Are any one-off charges or restructuring items called out in the release for this quarter?
why_this_order: Alphabet-level costs have grown as a share of revenue since 2025-Q3 and regularly offset segment gains; checking them first prevents misreading segment performance as deteriorating.
conditions: Apply whenever consolidated operating margin moves more than its Normality threshold or moves opposite to Services and Cloud margins.
exceptions: Skip if Services and Cloud margins both moved in the same direction as consolidated margin and Alphabet-level costs stayed within their normal band.

