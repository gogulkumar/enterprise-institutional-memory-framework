situation: A segment margin or below-the-line item moves outside its normal band, and the SEC release does not state a specific driver.
rule_type: stopping
rule: Locate the movement to the exact line or segment and report it as attributed with cause unverified; never infer an operational cause not stated in the filing.
conditions: Applies to all public-filing-only reviews where internal cost-center detail is out of scope.
counter_examples:
- Equity securities gains or losses explicitly called out in other income (cause is stated in the release).
- Named legal or severance charges listed in one_offs.csv.

