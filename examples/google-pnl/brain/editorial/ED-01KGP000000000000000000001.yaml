audience: Finance leadership reading the quarterly results
lead_with: The largest abnormal or unexplained movement in the quarter, rather than a routine top-to-bottom recap of total revenue.
always_include:
- Reconciliation between segment operating income and consolidated operating income (including Alphabet-level costs)
- Separation of operating performance from below-the-line other income swings when judging net income and EPS
- Any open Story Threads or watch conditions triggered during the quarter
omit_when:
- Sequential revenue swings that fall inside the established Services seasonal band
- One-off equity investment gains or losses presented as recurring operating trends
structure: Lead with the biggest surprise or broken expectation, then give short segment reads (Services, Cloud), then reconcile to consolidated operating income, and close with below-the-line items and open questions.

