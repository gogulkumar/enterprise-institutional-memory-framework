id: TP-01KGP000000000000000000001
kind: thinking_pattern
version: 1
title: Consolidated margin surprise
sensitivity: public
recorded_at: '2026-11-14T00:00:00Z'
scope:
  deliverables:
  - Quarterly P&L review commentary
valid_from: 2025-Q3
valid_to: null
last_supported: '2026-10-29'
provenance:
- SRC-01KGP000000000000000000001
- SRC-01KGP000000000000000000002
trust: observation
sureness: inferred
owner: example-owner
events: []
last_confirmed_by_owner: never
open_questions: []
related:
- BV-01KGP000000000000000000003
- BV-01KGP000000000000000000006
situation: Consolidated operating margin moves outside its normal pattern, or against segment margin trends
first_questions:
- Did Alphabet-level unallocated costs change as a share of total revenue?
- Did revenue mix shift materially between Google Services and Google Cloud?
- Are any one-off charges or restructuring items called out in the release for this quarter?
suspicion_triggers:
- Consolidated margin moves opposite to Services and Cloud margins
hypotheses_in_order:
- Alphabet-level costs changed as a share of revenue
- Revenue mix shifted between Services and Cloud
- A one-off charge was called out in the release
why_this_order: Alphabet-level costs have taken a larger share of revenue since 2025-Q3 and offset segment gains;
  checking them first avoids misreading segment performance as deteriorating.
checks:
- hypothesis: Alphabet-level costs changed as a share of revenue
  look_at: Alphabet-level activities as a share of revenue
  confirms_if: the share moved by more than its normal threshold
  rules_out_if: the share stayed in its range
- hypothesis: Revenue mix shifted between Services and Cloud
  look_at: Services and Cloud shares of revenue and their margins
  confirms_if: a segment's share moved materially
  rules_out_if: segment shares are stable
- hypothesis: A one-off charge was called out in the release
  look_at: data/one_offs.csv and the release
  confirms_if: a charge is stated for the quarter
  rules_out_if: no charge is stated
stop_when: The movement is located to Alphabet-level costs, mix or a stated charge, or reported as unexplained.
traps_i_avoid:
- Reading segment performance as deteriorating when Alphabet-level costs explain the move
judgments_applied:
- JD-01KGP000000000000000000001
conditions: Skip if Services and Cloud margins both moved with consolidated margin and Alphabet-level costs stayed
  in their band.
