subject: Net income and EPS against operating income
what_normal_looks_like: In quarters where other income swings, net income and EPS say little about operating performance,
  so judge the quarter on operating income.
what_usually_drives_it: Gains and losses on equity securities in other income.
what_is_fragile: Weakens if the net income to operating income ratio stays in its ordinary range for four quarters.
what_i_watch_first: Other income's share of income before taxes, because several quarters would otherwise be read
  as operating strength or weakness.
