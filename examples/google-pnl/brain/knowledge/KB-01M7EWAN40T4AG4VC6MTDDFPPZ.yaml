name: Cash tax timing
definition: Free cash flow can diverge from operating performance when cash taxes
  for multiple quarters fall in one quarter. Capital expenditure is another cash outflow;
  neither timing effect alone establishes deterioration in operating profitability.
  Management identified both effects in this quarter. CFO p11.
