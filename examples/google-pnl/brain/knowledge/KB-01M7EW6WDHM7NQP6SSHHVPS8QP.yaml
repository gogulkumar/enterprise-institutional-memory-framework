name: Revenue growth
meaning: 'Numerator: current quarter revenue less comparable prior-year quarter revenue.
  Denominator: comparable prior-year revenue. Multiply by 100 for percent. Constant
  currency excludes currency movements; not interchangeable with reported USD growth.'
source_of_truth: SRC-01M7EW62YX9KRY7ZBWAST2G1FG
validated: no_access
compare_to: Same quarter prior year for growth; prior-quarter comparison only when
  explicitly disclosed. GAAP and non-GAAP remain separate.
filters: Revenue entity and component fixed; fiscal quarter; USD reported or constant
  currency explicitly selected.
join: Pair quarter with same quarter prior year; same segment, component and currency-adjustment
  basis.
sign: Increase positive, decline negative; percent change, not percentage-point change.
breaks_down_as: Use only disclosed constituent lines on the same accounting basis;
  unreconciled transcript rounding is not a check.
