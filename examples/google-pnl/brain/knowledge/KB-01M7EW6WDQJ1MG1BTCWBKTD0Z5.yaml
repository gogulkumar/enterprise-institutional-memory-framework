name: TAC mix mechanism
definition: Management attributes slower traffic acquisition cost growth to the relative
  performance of Search and Network. Network carries a higher TAC rate; a shift toward
  Search can therefore reduce aggregate TAC intensity even while absolute TAC grows.
  This is an attributed revenue-mix mechanism, not independent proof of changes in
  individual distribution contracts. Q1 CFO p8 and Q&A p19-20.
