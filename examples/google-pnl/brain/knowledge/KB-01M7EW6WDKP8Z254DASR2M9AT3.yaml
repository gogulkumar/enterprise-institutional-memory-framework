name: Traffic acquisition costs
meaning: Positive operating cost, measured in USD; TAC/revenue is a separate ratio.
  Network and Search revenue mix affects aggregate TAC intensity without requiring
  a uniform change in partner payment rates.
source_of_truth: SRC-01M7EW62YX9KRY7ZBWAST2G1FG
validated: no_access
compare_to: Same quarter prior year for growth; prior-quarter comparison only when
  explicitly disclosed. GAAP and non-GAAP remain separate.
filters: Alphabet consolidated partner/distribution payments; fiscal quarter; USD;
  separate cost amount from TAC/revenue ratio.
join: Pair TAC with same-quarter revenue for rate; compare same fiscal quarter prior
  year for cost growth.
sign: Expense reported as positive cost magnitude; subtract in profit computation;
  falling cost rate need not mean falling dollars.
breaks_down_as: Use only disclosed constituent lines on the same accounting basis;
  unreconciled transcript rounding is not a check.
