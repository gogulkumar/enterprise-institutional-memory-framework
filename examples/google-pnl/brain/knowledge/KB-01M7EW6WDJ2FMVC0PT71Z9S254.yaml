name: Free cash flow
meaning: Operating cash inflows less capital expenditure cash outflows. A quarter
  is a flow for three months; trailing twelve months aggregates four successive quarters,
  not quarter annualization.
source_of_truth: SRC-01M7EW62YX9KRY7ZBWAST2G1FG
validated: no_access
compare_to: Same quarter prior year for growth; prior-quarter comparison only when
  explicitly disclosed. GAAP and non-GAAP remain separate.
filters: Alphabet consolidated; USD cash flows; select quarter or trailing four quarters
  consistently; not net income.
join: Match operating cash flow and asset purchases over identical interval; TTM sums
  four disjoint quarters.
sign: Operating cash inflow positive less capital-expenditure outflow magnitude; FCF
  can be negative.
breaks_down_as: Use only disclosed constituent lines on the same accounting basis;
  unreconciled transcript rounding is not a check.
