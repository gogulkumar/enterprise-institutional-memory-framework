name: Subscriptions and Workspace drivers
definition: 'Management distinguishes subscription customer growth from monetization
  per customer. YouTube and Google One subscriber additions support Services subscriptions,
  while Workspace revenue per seat supports Cloud. These are different segment drivers:
  a paid subscriber is not a Workspace seat, and neither usage nor account counts
  alone reproduce revenue. Q1 CFO p9-10.'
