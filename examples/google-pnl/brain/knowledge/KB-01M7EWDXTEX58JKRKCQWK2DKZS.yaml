name: Tax expense versus cash timing
definition: Accelerated R&D expensing and asset depreciation for tax purposes can
  change cash tax timing without matching the financial-reporting depreciation schedule.
  Management attributed cash-flow benefit to tax changes while higher infrastructure
  investment offset part of that benefit. This does not establish recurring operating
  cash improvement. Q3 CFO p10-13.
