name: Segment profitability bridge
definition: 'Google Services and Google Cloud are separate profit-generating segments,
  while Other Bets reports an operating loss. Segment operating income is not interchangeable
  with consolidated operating income: corporate costs outside segment performance
  must also be accounted for. This relationship identifies the scope needed to reconcile
  profit, without asserting a numerical bridge from rounded remarks. Q1 CFO p9-10.'
