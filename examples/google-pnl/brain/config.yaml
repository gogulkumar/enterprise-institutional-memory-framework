# Brain configuration (SPEC section 15.2). Fill in owner and backup_reviewer before running build.

owner: "example-owner"             # the person whose reasoning this brain learns and who ratifies changes
backup_reviewer: ""         # holds the queue when the owner is away; never ratifies reasoning entries

# Case thresholds (SPEC section 7.1)
candidate_events: 2
established_events: 4
established_periods: 2

observation_expiry: 2       # periods an observation survives without new support
observations_per_text: 20   # cap on new observations from one text

period_length: 1q           # the brain's reporting period; a window of `period` means this

# Review windows by entry kind (SPEC section 7.3); `period` = period_length, `none` = no window
review_windows:
  metric_definition: period
  known_issue: period
  source_of_truth: period
  calendar_point: period
  judgment: 4q
  thinking_pattern: 4q
  response_style: 4q
  business_view: 4q
  link: 4q
  impact_scope: 4q
  business_event: none
  default: 4q               # any kind not listed above

# Ratification queue (SPEC section 12.2)
queue_expiry: 2w
max_pending: 25

sensitivity_levels:         # ordered, least to most restricted
  - public
  - internal
  - confidential
  - restricted
